<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>Opening GitHub Copilot…</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./launch.js"></script>
  </head>
  <body class="launch">
    <main>
      <h1 id="launch-title">Opening GitHub Copilot…</h1>
      <p id="launch-message">Confirm in the Copilot app. This tab closes when you come back.</p>
      <p class="launch-actions">
        <a id="launch-fallback" hidden>Didn't open? Try GitHub's launcher</a>
        <button id="launch-close" type="button">Close tab</button>
      </p>
    </main>
  </body>
</html>
